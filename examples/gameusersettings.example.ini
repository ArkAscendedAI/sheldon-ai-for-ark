# =============================================================================
#  SheldonAI - ARK server configuration
# =============================================================================
#  Add the [SheldonAI] section below to your ARK server's GameUserSettings.ini
#  (Saved/Config/WindowsServer/GameUserSettings.ini) to connect the mod to your
#  running Sheldon Bridge.
#
#  The mod reads EXACTLY TWO settings, and that is all it needs. Everything else
#  about Sheldon (which AI model it uses, its personality, permissions, the
#  knowledge base) is configured on the BRIDGE, not here. If you have seen older
#  examples with keys like EnableUI, WelcomeMessage, or a [SheldonAI.Permissions]
#  section, ignore them: the mod does not read those.
# =============================================================================

[SheldonAI]

# Where the ARK server can reach your Sheldon Bridge.
#
#   - Use ws://  for a normal setup. The bridge serves a plain WebSocket by
#     default, so this is what almost everyone wants.
#   - Use wss:// ONLY if you configured the bridge with a TLS certificate
#     (SHELDON_SSL_CERT / SHELDON_SSL_KEY).
#
# Replace your-bridge-host with the IP address or hostname of the machine
# running the bridge, reachable from this ARK server. Keep the port that the
# bridge listens on (8443 by default). Do NOT add anything after the port.
#
# Examples:
#   WebSocketURL="ws://192.0.2.50:8443"      (bridge on another machine, by IP)
#   WebSocketURL="ws://bridge.example.com:8443"    (bridge behind a hostname)
WebSocketURL="ws://your-bridge-host:8443"

# A shared password the mod and the bridge use to trust each other. This MUST
# match the bridge's SHELDON_SHARED_SECRET exactly. Generate one with either:
#   sheldon-bridge secret
#   openssl rand -base64 48
AuthSecret=paste-the-exact-same-secret-you-set-on-the-bridge
